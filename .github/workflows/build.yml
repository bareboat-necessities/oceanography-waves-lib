name: build
on: [push, pull_request]

jobs:
  test:
    name: tests and quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libeigen3-dev

      - name: Build and run tests
        run: make -C tests clean check

      - name: Build and run tests with sanitizers
        run: |
          make -C tests clean check \
            CXXFLAGS='-std=c++20 -O1 -g -Wall -Wextra -Wpedantic -fno-omit-frame-pointer -fsanitize=address,undefined' \
            LDFLAGS='-fsanitize=address,undefined'

      - name: Compile data-sim
        run: make -C data-sim

  gen-sim-data:
    name: generate simulation data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++ libeigen3-dev

      - name: Generate wave simulation data
        run: |
          cd data-sim
          chmod +x gen_sim_data.sh
          ./gen_sim_data.sh
          cd ..

      - name: Build fenton waves
        run: |
          make -C plots -j 4 && cd plots && ./fenton_plots && mv *.csv ../data-sim/ && cd ..
          
      - name: Package simulation data
        run: |
          cd data-sim
          zip sim-data-files.zip ./*.csv
          cd ..

      - name: Upload simulation data to vTest release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: data-sim/sim-data-files.zip
          tag: ${{ github.ref == 'refs/heads/main' && 'vTest' || github.ref }}
          overwrite: true

      - name: Upload simulation data artifact
        uses: actions/upload-artifact@v4
        with:
          name: sim-data-files
          path: data-sim/*.csv
          if-no-files-found: error

  gen-plots:
    name: generate plots
    needs: gen-sim-data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++ libeigen3-dev texlive-xetex texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra texlive-fonts-extra dvipng python3-pip

      - name: Download simulation data artifact
        uses: actions/download-artifact@v4
        with:
          name: sim-data-files
          path: data-sim

      - name: Move data files for plotting
        run: mv data-sim/*.csv plots/

      - name: Generate plot files
        run: |
          python3 -m pip install --upgrade pip
          pip install matplotlib numpy pandas scipy
          cd plots
          chmod +x draw_plots.sh
          ./draw_plots.sh
          cd ..

      - name: Upload plot artifacts (.pgf + png)
        uses: actions/upload-artifact@v4
        with:
          name: plot-files
          path: |
            plots/*.pgf
            plots/*.png
          if-no-files-found: error

  build_latex:
    needs: gen-plots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plot files
        uses: actions/download-artifact@v4
        with:
          name: plot-files
          path: plots

      - name: Copy plots into LaTeX folder
        run: |
          mkdir -p doc
          cp plots/*.pgf doc/ || true
          cp plots/*.png doc/ || true

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: "*.tex"
          pre_compile: |
            echo "openout_any = a" | tee -a $(kpsewhich texmf.cnf)
            curl -L https://github.com/plantuml/plantuml/releases/download/v1.2025.4/plantuml.jar -o plantuml.jar && export PLANTUML_JAR=$(pwd)/plantuml.jar
            curl -L https://mirrors.ctan.org/macros/luatex/latex/plantuml/plantuml.sty -o plantuml.sty
            echo ">> Debug: TeX config patched, now checking PlantUML installation"
            plantuml -version || true
            java -version || true
          work_in_root_file_dir: true
          working_directory: doc
          latexmk_use_lualatex: true
          latexmk_shell_escape: true
          args: "-shell-escape"
          extra_system_packages: "inkscape ghostscript graphviz ncurses openjdk11-jre"
        env:
          PLANTUML_JAR: ${{ github.workspace }}/doc/plantuml.jar

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: latex-pdfs
          path: doc/**/*.pdf
          if-no-files-found: error

      - name: Upload PDF
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "**/*.pdf"
          tag: ${{ github.ref == 'refs/heads/main' && 'vTest' || github.ref }}
          overwrite: true
          file_glob: true
