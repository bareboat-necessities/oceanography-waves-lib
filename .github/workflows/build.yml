name: build
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: tests and quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libeigen3-dev

      - name: Build and run tests
        run: make -C tests clean check

      - name: Test release completeness and immutable tags
        run: python3 tests/release_contract.py

      - name: Audit all eight reference acceleration records
        run: |
          make -C tests reference_acceleration_audit
          tests/reference_acceleration_audit > reference-acceleration-audit.csv

      - name: Upload reference acceleration audit
        uses: actions/upload-artifact@v4
        with:
          name: reference-acceleration-audit
          path: reference-acceleration-audit.csv
          if-no-files-found: error

      - name: Build and run tests with sanitizers
        run: |
          make -C tests clean check \
            CXXFLAGS='-std=c++20 -O1 -g -Wall -Wextra -Wpedantic -fno-omit-frame-pointer -fsanitize=address,undefined' \
            LDFLAGS='-fsanitize=address,undefined'

      - name: Compile data-sim
        run: make -C data-sim

      - name: Check vessel replacement archive compatibility
        run: python3 tests/vessel_archive.py

  gen-sim-data:
    name: generate simulation data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++ libeigen3-dev
      - name: Generate surface and all four vessel datasets
        run: |
          cd data-sim
          bash gen_sim_data.sh
      - name: Build Fenton plotting tables
        run: |
          make -C plots -j4
          cd plots
          ./fenton_plots
          mv *.csv ../data-sim/
      - name: Audit all full vessel records
        run: |
          python3 data-sim/audit_vessel_data.py data-sim/vessel-rao-28ft > vessel-rao-reference-audit.csv
          for feet in 34 42 50; do
            python3 data-sim/audit_vessel_data.py "data-sim/vessel-rao-${feet}ft" > "vessel-rao-${feet}ft-reference-audit.csv"
          done
      - name: Package interchangeable simulation archives
        run: python3 data-sim/package_sim_data.py data-sim
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-archives
          path: data-sim/*.zip
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vessel-rao-reference-audit
          path: vessel-rao*reference-audit.csv
          if-no-files-found: error

  gen-plots:
    name: generate ${{ matrix.dataset }} plots
    needs: gen-sim-data
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dataset: surface
            data: sim-data-files.zip
            archive: plot-files.zip
            feet: 28
            prefix: unused_
          - dataset: vessel-rao
            data: sim-data-files-vessel-rao-28ft.zip
            archive: plot-files-vessel-rao-28ft.zip
            feet: 28
            prefix: vessel_rao_
          - dataset: vessel-rao-34ft
            data: sim-data-files-vessel-rao-34ft.zip
            archive: plot-files-vessel-rao-34ft.zip
            feet: 34
            prefix: vessel_rao_34ft_
          - dataset: vessel-rao-42ft
            data: sim-data-files-vessel-rao-42ft.zip
            archive: plot-files-vessel-rao-42ft.zip
            feet: 42
            prefix: vessel_rao_42ft_
          - dataset: vessel-rao-50ft
            data: sim-data-files-vessel-rao-50ft.zip
            archive: plot-files-vessel-rao-50ft.zip
            feet: 50
            prefix: vessel_rao_50ft_
    steps:
      - uses: actions/checkout@v4
      - name: Install plotting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra texlive-fonts-extra dvipng python3-pip
          python3 -m pip install matplotlib numpy pandas scipy
      - uses: actions/download-artifact@v4
        with:
          name: simulation-archives
          path: data-sim
      - name: Extract selected dataset
        env:
          DATA_ARCHIVE: ${{ matrix.data }}
        run: unzip -q "data-sim/$DATA_ARCHIVE" -d plots
      - name: Generate surface plots
        if: matrix.dataset == 'surface'
        run: |
          cd plots
          bash draw_plots.sh
      - name: Generate vessel RAO plots
        if: matrix.dataset != 'surface'
        env:
          VESSEL_FEET: ${{ matrix.feet }}
          PLOT_PREFIX: ${{ matrix.prefix }}
        run: python3 plots/wave_sim_plots.py --input-dir plots --output-dir plots --vessel-rao --vessel-length-ft "$VESSEL_FEET" --prefix "$PLOT_PREFIX"
      - name: Check and package charts
        env:
          CHART_ARCHIVE: ${{ matrix.archive }}
          DATASET: ${{ matrix.dataset }}
        run: |
          python3 tests/chart_outputs.py plots "$DATASET"
          python3 plots/package_plots.py plots "$CHART_ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: plot-files-${{ matrix.dataset }}
          path: |
            plots/*.pgf
            plots/*.svg
            plots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: chart-archive-${{ matrix.dataset }}
          path: ${{ matrix.archive }}
          compression-level: 0
          if-no-files-found: error

  build_latex:
    needs: gen-plots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: plot-files-*
          merge-multiple: true
          path: plots
      - name: Copy plots and raster sidecars into LaTeX folder
        run: |
          cp plots/*.pgf doc/
          cp plots/*.png doc/
      - name: Compile all nine LaTeX documents
        uses: xu-cheng/latex-action@v4
        with:
          root_file: "*.tex"
          texlive_version: 2025
          work_in_root_file_dir: true
          working_directory: doc
          latexmk_use_lualatex: true
      - uses: actions/upload-artifact@v4
        with:
          name: latex-pdfs
          path: doc/*.pdf
          if-no-files-found: error

  release:
    name: publish complete versioned release
    needs: [test, gen-sim-data, gen-plots, build_latex]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: simulation-archives
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: chart-archive-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: latex-pdfs
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: '*reference-audit'
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: reference-acceleration-audit
          path: release-assets
      - name: Validate assets and publish VERSION from this exact successful commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/release.py release-assets --publish
